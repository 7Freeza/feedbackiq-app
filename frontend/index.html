<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeedbackIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <canvas id="token-field" aria-hidden="true"></canvas>

  <header class="nav" id="nav">
    <a class="nav__brand" href="#/">Feedback<span>IQ</span></a>
    <nav class="nav__links" aria-label="Principal">
      <a class="nav__link is-active" href="#/" data-route="/">Analizar</a>
      <a class="nav__link" href="#/docs" data-route="/docs">Método</a>
    </nav>
  </header>

  <main id="app" class="app"></main>

  <footer class="report-footer" id="report-footer">
    <div class="report-footer__inner">
      <p class="eyebrow">Soporte</p>
      <h2 class="report-footer__title">¿Encontraste un problema?</h2>
      <p class="report-footer__lead">Cuéntanos qué falló. Lo clasificamos y lo enviamos al canal de reportes. Si dejas tu correo, te enviamos una guía automática de solución.</p>
      <form class="report-form" id="report-form" novalidate>
        <label class="report-form__label" for="report-msg">Mensaje</label>
        <textarea
          id="report-msg"
          class="report-form__textarea"
          name="mensaje"
          rows="4"
          maxlength="4000"
          minlength="10"
          required
          placeholder="Ej. Al subir el Excel de reseñas, la optimización se queda cargando y no devuelve el archivo…"
        ></textarea>
        <label class="report-form__label report-form__label--spaced" for="report-email">Correo (opcional)</label>
        <input
          type="email"
          id="report-email"
          class="report-form__input"
          name="email"
          maxlength="254"
          autocomplete="email"
          placeholder="para recibir la guía de solución por email"
        />
        <div class="report-form__row">
          <button type="submit" class="btn" id="report-submit">Enviar reporte</button>
          <p class="report-form__status state state--info" id="report-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </footer>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
